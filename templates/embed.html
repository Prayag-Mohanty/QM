<!doctype html>
<html lang="{{ q.language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ q.title }} | {{ site.title }}</title>
<link rel="canonical" href="{{ canonical }}">
<meta name="robots" content="noindex, follow">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>try{if(localStorage.getItem("qm-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="icon" href="{{ site.base }}assets/favicon-64.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=swap">
<link rel="stylesheet" href="{{ asset("style.css") }}">
</head>
<body class="embed">
{% set embed = true %}
{% include "_viewer.html" %}
<script src="{{ asset("viewer.js") }}" defer></script>
</body>
</html>
