<li class="card" data-search="{{ q.search_text }}" data-tags="{{ q.tags|map('slugify')|join(' ') }}">
  <a class="card-link" href="{{ site.base }}quiz/{{ q.slug }}/">
    <span class="card-thumb">
      <img src="{{ q.thumb_url }}" alt="First slide of {{ q.title }}" loading="lazy" decoding="async">
    </span>
    <span class="card-title">{{ q.title }}</span>
  </a>
  <span class="card-author">{{ q.quizmasters|join(', ') }}</span>
  <span class="card-meta">
    <span class="card-stat"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>{{ q.slide_count }} slides</span>
    <time datetime="{{ q.date.isoformat() }}">{{ q.date|pretty_date }}</time>
    {% if q.has_av %}<span class="card-stat card-av" title="Includes audio &amp; video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg>A/V</span>{% endif %}
  </span>
</li>
